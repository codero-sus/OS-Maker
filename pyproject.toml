# OS Maker is two standalone scripts (build_os.py and os_maker.py) with no runtime
# dependencies, so there is nothing to install -- this file only holds tool config.
[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PIE", "RUF"]
# Long help/usage strings read better unwrapped, and ruff format owns the layout.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RET504"]

[tool.ruff.lint.per-file-ignores]
# tests name arguments to match the API they stub (lambda patch: ..., **kwargs) or to
# keep a readable subTest label, so unused-argument rules do not apply there
"tests/*" = ["ARG005", "ARG002"]

# Two scripts, no runtime dependencies -- mypy and coverage are developer tools, and
# the config lives here so `python3 -m mypy` / `python3 -m coverage` need no flags.
[tool.mypy]
python_version = "3.10"
files = ["build_os.py", "os_maker.py"]
strict = true

[[tool.mypy.overrides]]
# readline is imported inside a try/except because Windows' stdlib has no such module
module = ["readline.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["build_os", "os_maker"]

[tool.coverage.report]
skip_covered = false
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
