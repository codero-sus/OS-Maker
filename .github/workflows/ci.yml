name: CI

on:
  push:
  pull_request:
  # lets a maintainer run the expensive real-ISO job against a branch on demand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "ruff>=0.6" "mypy>=1.11"
      - run: ruff check build_os.py os_maker.py os_builder.py os_builder_gui.py tools tests
      - run: ruff format --check build_os.py os_maker.py os_builder.py os_builder_gui.py tools tests
      # the scripts are checked with mypy --strict (configured in pyproject.toml)
      - run: python -m mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: python -c "import shutil,sys,tempfile;print(sys.platform, sys.version.split()[0], tempfile.gettempdir(), shutil.which('bash'))"
      - name: Byte-compile the scripts
        run: python -m compileall -q build_os.py os_maker.py os_builder.py os_builder_gui.py tools/style_sheet.py
      - name: Unit and integration tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -t . 2>&1 | tee unittest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" != "0" ]; then
            # Log storage can be unreachable, so surface the failures as annotations.
            summary=$(grep -E "^(FAIL|ERROR):" unittest.log | head -12 | sed 's/^/  /')
            details=$(grep -E "^(FAIL|ERROR):|\*\*\*|Error:|assert" unittest.log | head -40)
            { echo "$summary"; echo; echo "$details"; } | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error::/'
            exit "$status"
          fi
      - name: Shell smoke test (simulator end to end)
        shell: bash
        run: >
          python os_maker.py --no-save --no-banner
          -e "mkdir -p /tmp/demo"
          -e "write /tmp/demo/notes.txt hello from CI"
          -e "cat /tmp/demo/notes.txt"
          -e "tree /tmp/demo"
          -e "df"
      - name: Builder dry run (no Docker required)
        shell: bash
        run: >
          python build_os.py --name "CI Test OS" --release trixie --architecture arm64
          --packages sudo,neofetch --compression zstd --dry-run
      - name: Recipe builder, headless modes
        shell: bash
        run: |
          # The GUI needs a display, but every mode it drives does not: these are the
          # same code paths the buttons use, so the app is covered on all three OSes.
          python os_builder.py --list-presets > /dev/null
          python os_builder.py --new --out starter.json --preset minimal
          python os_builder.py --check starter.json examples/aurora-desktop.json examples/rescue-usb.json examples/retro-arcade.json
          python os_builder.py --preview starter.json
          python os_builder.py --wallpaper starter.json --out starter.png
          test -s starter.png
          python os_builder.py --explain | grep -q wallpaper_seed
          python os_builder.py --preview starter.json --json | python -m json.tool > /dev/null
          python os_builder.py --preset-info minimal
          python os_builder.py --batch examples/
          python os_builder.py --check starter.json --json | python -m json.tool > /dev/null
          python os_builder.py --fix starter.json > /dev/null
          # two different recipes must be reported as different, and that is exit 1;
          # `set -e` is on, so ask for the status instead of letting the step die on it
          python os_builder.py --diff examples/aurora-desktop.json examples/retro-arcade.json > /dev/null ||
          rc=$?
          test "${rc:-0}" = "1"
          # the flags must not need a display: --gui-check only asks whether one exists
          python os_builder.py --gui-check || true
          # the README image is generated, so prove the generator still runs
          python tools/style_sheet.py --tile 48x27 --out sheet.png
          test -s sheet.png

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade coverage[toml]
      - name: Run the suite under branch coverage
        run: python -m coverage run -m unittest discover -s tests -t .
      - name: Report
        shell: bash
        run: |
          # The floor is a ratchet: raise it when coverage improves, never lower it.
          set +e
          python -m coverage report --fail-under=90 > coverage.txt 2>&1
          status=$?
          set -e
          cat coverage.txt
          {
            echo "### Branch coverage"
            echo
            echo '```'
            tail -n 4 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "0" ]; then
            # job logs are not always reachable, so put the numbers in an annotation
            grep -E "TOTAL|failure|Error|error" coverage.txt | head -6 | sed 's/^/::error::/'
            exit "$status"
          fi

  native-build:
    name: Real ISO build (Docker)
    # The expensive job: a full Debian live image, booted headless.  Runs on pushes to
    # main, and on demand -- workflow_dispatch exists so a branch can be proven to build
    # before it is merged.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QEMU (used to boot-test the result)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      # One build only, and it goes through the recipe builder on purpose: that is the
      # same code the GUI runs (validate -> branding -> argv -> build_os.py), so this job
      # covers both programs at once.  --boot-test boots the finished ISO headless and
      # fails unless the live system reaches its login prompt.
      - name: Write the CI recipe
        run: |
          cat > ci-recipe.json <<'JSON'
          {
            "name": "CI Minimal",
            "tagline": "branded by the recipe builder",
            "hostname": "ci-minimal",
            "motd": "CI Minimal: branded by the recipe builder.\n",
            "release": "trixie",
            "architecture": "amd64",
            "preset": "minimal",
            "packages": ["linux-image-amd64", "live-boot", "sudo"],
            "compression": "lz4",
            "with_wallpaper": true,
            "wallpaper_style": "rays",
            "wallpaper_size": "800x450",
            "accent": "#39d353",
            "container": "auto",
            "boot_test": true,
            "boot_timeout": 420,
            "output_dir": "dist",
            "cache_dir": "${{ runner.temp }}/apt-cache"
          }
          JSON
          python os_builder.py --check ci-recipe.json
      - name: Build a branded live ISO and boot it
        run: python os_builder.py --build ci-recipe.json
      - name: Check the branding really landed inside the image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          iso=$(ls dist/*.iso | head -1)
          test -n "$iso"
          dir=$(mktemp -d)
          sudo mount -o loop,ro "$iso" "$dir"
          squash=$(find "$dir" -maxdepth 3 -name filesystem.squashfs | head -1)
          test -n "$squash"
          # the whole rootfs, deliberately: -e means different things across
          # squashfs-tools versions, and a minimal image costs seconds to unpack
          sudo unsquashfs -no-progress -d "$dir/root" "$squash" > /dev/null
          grep -q 'PRETTY_NAME="CI Minimal"' "$dir/root/etc/os-release"
          grep -q '^ci-minimal$' "$dir/root/etc/hostname"
          # the line the hook echoes into the build log is what proves live-build really
          # ran it: /etc/hostname alone could have come from either mechanism
          grep -q 'os-builder: branding installed' dist/*.iso.log
          grep -q 'OS_MAKER_PRESET=minimal' "$dir/root/etc/os-release"
          grep -q 'branded by the recipe builder' "$dir/root/etc/motd"
          # read the wallpaper back with the builder's own PNG header reader, so a
          # truncated file inside the image fails here rather than on a monitor
          python - "$dir/root/usr/share/backgrounds/os-maker.png" <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          import os_builder

          size = os_builder.read_png_size(Path(sys.argv[1]))
          if size != (800, 450):
              raise SystemExit(f"wallpaper inside the image is {size[0]}x{size[1]}, expected 800x450")
          print(f"wallpaper in the image: {size[0]}x{size[1]} PNG, ok")
          PY
          sudo umount "$dir"
          sudo rm -rf "$dir"
      - name: Record the image checksum in the job summary
        if: always()
        run: |
          {
            echo "## Built image"
            ls -l dist/ || true
            echo '```'
            (cd dist && sha256sum *.iso 2>/dev/null || echo "no ISO produced")
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
